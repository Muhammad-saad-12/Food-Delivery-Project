version: '3.8'

services:
  # Client Frontend Production Service
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: restaurant-client-prod
    restart: unless-stopped
    networks:
      - restaurant-prod-net

  # Express REST API & Socket.IO Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant-api-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb_prod:27017/restaurant_prod_db
      - JWT_SECRET=${JWT_SECRET:-supersecret_production_jwt_key_restaurant_system_change_me}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-https://localhost}
    depends_on:
      mongodb_prod:
        condition: service_healthy
    networks:
      - restaurant-prod-net

  # Production MongoDB Service
  mongodb_prod:
    image: mongo:7.0
    container_name: restaurant-mongodb-prod
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=restaurant_prod_db
    volumes:
      - mongo_prod_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - restaurant-prod-net

  # Nginx Reverse Proxy with SSL Termination & WebSocket proxying
  nginx:
    image: nginx:alpine
    container_name: restaurant-nginx-edge
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - api
      - client
    networks:
      - restaurant-prod-net

  # Certbot SSL Automation Service (Auto-Renews Every 12 Hours)
  certbot:
    image: certbot/certbot
    container_name: restaurant-certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - restaurant-prod-net

volumes:
  mongo_prod_data:
    driver: local
  certbot_www:
    driver: local
  certbot_certs:
    driver: local

networks:
  restaurant-prod-net:
    driver: bridge
