version: '3.8'

services:
  # Node.js Express API & Socket.IO backend service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/restaurant_db
      - JWT_SECRET=supersecret_jwt_key_restaurant_system_change_me
      - CLIENT_ORIGIN=http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - restaurant-network

  # MongoDB Database service
  mongodb:
    image: mongo:7.0
    container_name: restaurant-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_DATABASE=restaurant_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - restaurant-network

volumes:
  mongo_data:
    driver: local

networks:
  restaurant-network:
    driver: bridge
